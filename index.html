<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room hub main display</title>
<style>
:root{--page:hsl(210 14% 84%);--bg:hsl(210 18% 94%);--s1:#fff;--s2:hsl(210 16% 89%);--tx:hsl(222 25% 12%);--mu:hsl(220 8% 38%);--ln:hsl(222 25% 15% / .1);--on:#fff;--ac:hsl(258 70% 30%);--as:hsl(258 70% 30% / .13);--bulb:hsl(258 70% 58%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:hsl(222 14% 4%);--bg:hsl(222 12% 8%);--s1:hsl(222 11% 12%);--s2:hsl(222 10% 18%);--tx:hsl(220 20% 94%);--mu:hsl(220 8% 66%);--ln:hsl(220 20% 90% / .09);--on:hsl(222 20% 6%)}}
:root[data-theme="dark"]{--page:hsl(222 14% 4%);--bg:hsl(222 12% 8%);--s1:hsl(222 11% 12%);--s2:hsl(222 10% 18%);--tx:hsl(220 20% 94%);--mu:hsl(220 8% 66%);--ln:hsl(220 20% 90% / .09);--on:hsl(222 20% 6%)}
html,body{height:100%;overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .6s;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{height:100%}
.stage{container-type:inline-size;position:relative;height:100%;background:var(--bg);overflow:hidden;transition:background .6s;touch-action:pan-x}
.pgs{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pgs::-webkit-scrollbar{display:none}
.g{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:1.4cqw 1.4cqw 4cqw;display:grid;gap:1.1cqw;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr))}
.t{position:relative;container-type:size;min-width:0;min-height:0;background:var(--s1);border:1px solid var(--ln);border-radius:1.6cqw;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .2s,background .6s}
.t.up{z-index:5;transform:scale(1.02);outline:2px solid var(--ac)}
.in{height:100%;padding:6cqmin;display:flex;flex-direction:column;justify-content:space-between;gap:3cqmin;transition:opacity .2s}
.up .in{opacity:.15}
.lb{font-size:max(11px,5cqmin);color:var(--mu)}
.h{font-size:max(12px,6cqmin);font-weight:500}
.big{font-size:max(18px,24cqmin);line-height:1;font-weight:400}
.i{width:max(16px,7cqmin);height:max(16px,7cqmin);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.r{display:flex;align-items:center;gap:3cqmin}
.sp{justify-content:space-between}
.gr{font-size:max(13px,7cqmin)}
.time{font-size:min(30cqw,50cqh);font-weight:300;line-height:.95;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.bar{width:12cqmin;height:1.2cqmin;min-height:3px;border-radius:9px;background:var(--ac);margin:4cqmin 0}
.dt{font-size:max(12px,6cqmin);color:var(--mu)}
.rows{display:flex;flex-direction:column;gap:5cqmin;overflow:hidden}
.ev{display:flex;gap:4cqmin;font-size:max(12px,5.5cqmin);align-items:baseline}
.ev b{font-weight:400;color:var(--mu);font-variant-numeric:tabular-nums;min-width:12cqmin}
.ev:first-child b{color:var(--ac)}
.orb{width:min(34cqh,34cqw);height:min(34cqh,34cqw);border-radius:50%;background:var(--bulb);transition:opacity .3s,background .6s;flex:none}
.orb.off{background:var(--s2);opacity:1!important}
@container (max-height:290px){.orb{display:none}}
.sw{display:flex;gap:3cqmin;flex-wrap:wrap}
.sw button{width:max(28px,8cqmin);height:max(28px,8cqmin);border-radius:50%}
.sw button[aria-pressed=true]{outline:2px solid var(--tx);outline-offset:3px}
.tg{width:48px;height:28px;border-radius:99px;background:var(--s2);padding:4px;display:flex;align-items:center;flex:none}
.tg span{width:20px;height:20px;border-radius:50%;background:var(--mu);transition:transform .2s}
.tg[aria-checked=true]{background:var(--ac)}
.tg[aria-checked=true] span{transform:translateX(20px);background:var(--on)}
input[type=range]{width:100%;accent-color:var(--ac);height:32px;touch-action:pan-y}
.chips{display:flex;gap:3cqmin;flex-wrap:wrap}
.chip{padding:0 5cqmin;min-height:40px;border-radius:99px;background:var(--s2);font-size:max(12px,5.5cqmin)}
.chip[aria-pressed=true]{background:var(--ac);color:var(--on)}
.tl{display:flex;flex-direction:column;gap:2.5cqmin;overflow:hidden;flex:1;justify-content:center}
.tr{display:flex;align-items:center;gap:3cqmin;font-size:max(13px,6cqmin)}
.tr b{font-weight:400;font-variant-numeric:tabular-nums;min-width:5ch}
.tp{flex:1;height:1.6cqmin;min-height:4px;background:var(--s2);border-radius:9px}
.tp i{display:block;height:100%;background:var(--ac);border-radius:9px}
.tx{width:32px;height:32px;border-radius:50%;background:var(--s2);font-size:16px}
.none{color:var(--mu);font-size:max(12px,5.5cqmin)}
.art{overflow:hidden;width:min(45cqh,60cqw);aspect-ratio:1;border-radius:6cqmin;background:var(--as);color:var(--ac);display:flex;align-items:center;justify-content:center}
.art .i{width:30%;height:30%}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.mt{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@container (max-height:300px){.art{display:none}}
.trk{width:100%;height:1.6cqmin;min-height:4px;border-radius:9px;background:var(--s2)}
.trk div{width:100%;height:100%;border-radius:9px;background:var(--ac);transform-origin:0 50%;transform:scaleX(.38)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:8cqmin}
.ctrl .i{fill:currentColor}
.pp{width:max(44px,16cqmin);height:max(44px,16cqmin);border-radius:50%;background:var(--ac);color:var(--on);display:flex;align-items:center;justify-content:center}
.msgs{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2.5cqmin;overflow:hidden}
.bub{max-width:85%;padding:2.5cqmin 4cqmin;border-radius:4cqmin;font-size:max(12px,5.5cqmin)}
.me{align-self:flex-end;background:var(--as)}
.ai{align-self:flex-start;background:var(--s2)}
.inp{flex:1;min-height:44px;border-radius:99px;background:var(--s2);color:var(--mu);display:flex;align-items:center;padding:0 16px;font-size:max(12px,5.5cqmin);text-align:left}
.mic{width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--on);display:flex;align-items:center;justify-content:center;flex:none}
.ov{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:2}
.up .ov{display:flex}
.ov .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ov button{min-height:40px;min-width:44px;padding:0 14px;border-radius:99px;background:var(--s2);font-size:14px}
.ov button.on{background:var(--ac);color:var(--on)}
.dots{position:absolute;bottom:1.3cqw;left:0;right:0;display:flex;justify-content:center;gap:1.2cqw;pointer-events:none}
.dots button{pointer-events:auto;position:relative;width:1.1cqw;height:1.1cqw;min-width:9px;min-height:9px;border-radius:99px;background:var(--s2);transition:width .2s,background .2s}
.dots button::after{content:"";position:absolute;inset:-16px -8px}
.dots button[aria-current=true]{background:var(--ac);width:3cqw;min-width:24px}
.fab{position:absolute;bottom:.7cqw;width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--on);display:flex;align-items:center;justify-content:center;z-index:9}
.fab .i{width:20px;height:20px}
.pill{position:absolute;top:.5cqw;left:50%;transform:translateX(-50%);width:6cqw;min-width:56px;height:6px;border-radius:9px;background:var(--mu);opacity:.45;z-index:9}
.pill::after{content:"";position:absolute;inset:-14px -12px}
.pick{display:none;position:absolute;right:1.4cqw;bottom:62px;z-index:10;background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:8px;flex-direction:column;gap:4px}
.pick.on{display:flex}
.pick button{text-align:left;padding:10px 16px;min-height:44px;border-radius:10px;font-size:15px}
.pick button:hover{background:var(--s2)}
.toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;white-space:nowrap}
.toast.on{opacity:1}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:25}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;z-index:30;background:var(--bg);border:1px solid var(--ln);padding:2cqw;display:flex;flex-direction:column;gap:1.4cqw;transition:transform .3s}
.sq{top:0;height:48%;border-radius:0 0 2cqw 2cqw;transform:translateY(-104%)}
.sb{bottom:0;height:64%;border-radius:2cqw 2cqw 0 0;transform:translateY(104%)}
.sheet.open{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center}
.sht{font-size:max(16px,2cqw);font-weight:500}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw;flex:1;min-height:0}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:1.4cqw;padding:1.6cqw;display:flex;flex-direction:column;gap:1cqw;justify-content:space-between;min-height:0}
.ql{display:flex;align-items:center;gap:8px;font-size:max(13px,1.4cqw);color:var(--mu)}
.ql .i,.sht .i{width:20px;height:20px}
.qr{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:max(14px,1.5cqw)}
.sheet .chip{font-size:max(13px,1.5cqw);padding:0 2cqw;min-height:44px}
.sheet .chips{gap:1cqw}
.sheet .sw{gap:1.2cqw}
.sheet .sw button{width:max(32px,2.8cqw);height:max(32px,2.8cqw)}
.sheet .lb{font-size:max(12px,1.3cqw)}
.dash{border:2px dashed var(--ln);border-radius:1.2cqw;min-height:44px;color:var(--mu);font-size:max(13px,1.4cqw)}
.asst{position:absolute;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;gap:1.2cqw;padding:2cqw}
.asst.on{display:flex}
.am{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1cqw;justify-content:flex-start}
.am .bub{max-width:70%;font-size:max(14px,1.8cqw);padding:1cqw 1.6cqw;border-radius:1.6cqw}
.asst .chips{gap:1cqw}
.asst .chip{font-size:max(13px,1.5cqw);padding:0 2cqw;min-height:44px}
.ar{display:flex;gap:1cqw;align-items:center}
#ain{flex:1;min-height:52px;border-radius:99px;border:1px solid var(--ln);background:var(--s1);color:var(--tx);padding:0 20px;font:inherit;font-size:max(15px,1.7cqw)}
.ar .mic{width:52px;height:52px}
.alert,.amb{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.6cqw}
.alert{z-index:70}.amb{z-index:60}
.alert.on,.amb.on{display:flex}
.at{font-size:6cqw;font-weight:400}
.as2{font-size:2.4cqw;color:var(--mu)}
.big2{font-size:22cqw;font-weight:300;line-height:.95;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.stop{min-height:56px;padding:0 40px;border-radius:99px;background:var(--ac);color:var(--on);font-size:max(16px,1.9cqw)}
.dim{position:absolute;inset:0;background:#000;pointer-events:none;z-index:99;opacity:0}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.t{border:0;border-radius:2.2cqw}
.in{padding:7cqmin}
.h{font-size:clamp(13px,4.8cqmin,20px);color:var(--mu);font-weight:500}
.lb{font-size:clamp(11px,4.4cqmin,16px)}
.big{font-size:max(22px,30cqmin)}
.orb.off{background:transparent;box-shadow:inset 0 0 0 2px var(--ln)}
.fab{background:var(--s1);color:var(--mu);border:1px solid var(--ln)}
.lt{position:absolute;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;gap:2cqw;padding:2.4cqw}
.lt.on{display:flex}
.lbody{flex:1;display:flex;gap:5cqw;align-items:center;min-height:0}
.wheel{position:relative;height:100%;aspect-ratio:1;flex:none}
.wheel canvas{width:100%;height:100%;border-radius:50%;touch-action:none;display:block}
.wm{position:absolute;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.45);transform:translate(-50%,-50%);pointer-events:none}
.lside{flex:1;display:flex;flex-direction:column;gap:1.6cqw}
.lside .lb{font-size:max(13px,1.4cqw)}
.xpb{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1.2cqw;font-size:max(16px,1.9cqw)}
.xbig{font-size:12cqw;font-weight:300;line-height:1}
.xs{color:var(--mu)}
.xh{color:var(--mu);font-size:max(13px,1.4cqw);margin-top:1.2cqw}
.xpb .ev{font-size:max(16px,1.9cqw)}
.xpb .ev b{min-width:9ch}
</style></head><body>

<main class="wrap">
<div class="stage" id="st">
<div class="pgs" id="pgs"><div class="g" aria-label="Page 1"></div><div class="g" aria-label="Page 2"></div><div class="g" aria-label="Page 3"></div></div>
<button class="pill" id="pill" aria-label="Quick settings"></button>
<div class="dots" id="dots"><button aria-label="Page 1"></button><button aria-label="Page 2"></button><button aria-label="Page 3"></button></div>
<button class="fab" style="left:1.4cqw" data-a="ao" aria-label="Assistant"><svg class="i"><use href="#i-mic"/></svg></button>
<button class="fab" id="homeb" style="right:calc(1.4cqw + 54px)" aria-label="Home devices"><svg class="i"><use href="#i-grid"/></svg></button>
<button class="fab" id="add" style="right:1.4cqw" aria-label="Add widget"><svg class="i"><use href="#i-plus"/></svg></button>
<div class="pick" id="pick"></div>
<div class="scrim" id="scrim"></div>

<div class="card"><div class="qr"><span>Do not disturb</span><button class="tg js-dnd" role="switch" data-a="dnd" aria-label="Do not disturb"><span></span></button></div><div class="qr"><span>Theme</span><div class="chips"><button class="chip js-md" data-a="md" data-m="auto">Auto</button><button class="chip js-md" data-a="md" data-m="light">Day</button><button class="chip js-md" data-a="md" data-m="dark">Night</button></div></div><div class="chips"><button class="chip" data-a="sv">Screen saver</button><button class="chip" data-a="ed">Edit layout</button></div></div>

<section class="sheet sb" id="sb" aria-label="Home">

<div class="sg">

</div></section>

<div class="chips" id="sug"></div>
<div class="ar"><input id="ain" placeholder="Type or tap the mic" aria-label="Ask the assistant" autocomplete="off"><button class="mic" data-a="ml" aria-label="Speak"><svg class="i" style="width:22px;height:22px"><use href="#i-mic"/></svg></button><button class="mic" data-a="sd" aria-label="Send"><svg class="i" style="width:22px;height:22px"><use href="#i-send"/></svg></button></div>
</section>

<script>
/* ===== Persistence: layout and settings saved in this browser (localStorage "roomhub:v1") and on the Pi (/api/settings) =====
   On load the newer of the two copies wins; changes are pushed to the Pi a moment after they happen.
   If the Pi can't be reached, the browser copy keeps working and the push is retried every 15 s.
   Saved: widget layout, theme mode, screen brightness, volume, do-not-disturb, alarm, running timers.
   Not saved: the light's state (the bulb is the source of truth). Settings sheet has Export / Import / Reset. */
(function(){
  const KEY="roomhub:v1";
  let resetting=false,last="";
  const isInt=(n,a,b)=>Number.isInteger(n)&&n>=a&&n<=b;
  const snap=()=>({v:1,
    layout:W.map(w=>({id:w.id,t:w.t,p:w.p,x:w.x,y:w.y,w:w.w,h:w.h})),
    settings:Object.assign({mode:S.mode,scr:S.scr,vol:S.vol,dnd:S.dnd},PI?{}:{alarm:{h:S.alarm.h,m:S.alarm.m,on:S.alarm.on},
      timers:S.timers.map(t=>({id:t.id,label:t.label,end:t.end,total:t.total}))})});

  function cleanLayout(list){
    if(!Array.isArray(list))return null;
    const out=[];
    for(const o of list){
      if(!o||!T[o.t]||!isInt(o.id,1,1e9)||!isInt(o.p,0,2)||!isInt(o.w,1,12)||!isInt(o.h,1,8)||!isInt(o.x,1,13-o.w)||!isInt(o.y,1,9-o.h))continue;
      const n={id:o.id,t:o.t,p:o.p,x:o.x,y:o.y,w:o.w,h:o.h};
      if(out.some(b=>b.id===n.id||hit(b,n)))continue;
      out.push(n);
    }
    return out;
  }
  function applySettings(st){
    if(!st||typeof st!=="object")return;
    if(["auto","light","dark"].includes(st.mode))S.mode=st.mode;
    if(isInt(st.scr,20,100))S.scr=st.scr;
    if(isInt(st.vol,0,100))S.vol=st.vol;
    if(typeof st.dnd==="boolean")S.dnd=st.dnd;
    const a=st.alarm;
    if(!PI&&a&&isInt(a.h,0,23)&&isInt(a.m,0,59)&&typeof a.on==="boolean")S.alarm={h:a.h,m:a.m,on:a.on};
    if(!PI&&Array.isArray(st.timers))S.timers=st.timers.filter(t=>t&&isInt(t.id,1,1e9)&&typeof t.end==="number"&&t.end>Date.now()&&typeof t.total==="number"&&t.total>0)
      .map(t=>({id:t.id,label:String(t.label||"Timer").slice(0,40),end:t.end,total:t.total}));
  }
  function apply(d){
    if(!d||d.v!==1)return false;
    const lay=cleanLayout(d.layout);
    if(lay&&(lay.length||(Array.isArray(d.layout)&&!d.layout.length))){
      W.forEach(w=>{if(w.el)w.el.remove()});
      W=lay;uid=Math.max(uid,...W.map(w=>w.id),0);
      W.forEach(place);
    }
    applySettings(d.settings);
    S.timers.forEach(t=>{uid=Math.max(uid,t.id)});
    paint();dots();
    return true;
  }
  const AT=KEY+":at";           /* when the browser copy was last changed */
  let synced=false,piDirty=false,piBusy=false,piTry=0,pullTry=0;
  const tmo=ms=>{if(typeof AbortController==="undefined")return undefined;const a=new AbortController();setTimeout(()=>a.abort(),ms);return a.signal};
  const localAt=()=>{try{return +localStorage.getItem(AT)||0}catch(e){return 0}};
  function save(force){
    if(resetting)return;
    try{const j=JSON.stringify(snap());if(force||j!==last){localStorage.setItem(KEY,j);localStorage.setItem(AT,Date.now());last=j;piDirty=true}}catch(e){}
    pushPi();
  }
  async function pushPi(){
    if(!piDirty||piBusy||resetting||!synced||Date.now()<piTry)return;
    piBusy=true;
    try{
      const r=await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({at:localAt(),data:JSON.parse(last)}),keepalive:true,signal:tmo(6000)});
      if(r.ok)piDirty=false;else piTry=Date.now()+15000;
    }catch(e){piTry=Date.now()+15000}
    piBusy=false;
  }
  /* Ask the Pi for its copy. If it is newer than ours (or we have none), use it; if ours is newer, push ours. */
  async function pullPi(){
    try{
      const r=await fetch("/api/settings",{cache:"no-store",signal:tmo(4000)});
      const d=await r.json();
      if(!d||d.ok!==true)return;
      const at=+d.at||0;
      if(d.data&&at>localAt()){
        if(apply(d.data)){last=JSON.stringify(snap());try{localStorage.setItem(KEY,last);localStorage.setItem(AT,at)}catch(e){}piDirty=false}
      }else if(localAt()>at)piDirty=true;
      synced=true;pushPi();
    }catch(e){/* Pi not reachable: try again later */}
  }

  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(apply(d))last=JSON.stringify(snap())}}catch(e){}
  if(!last)last=JSON.stringify(snap());
  const tick=()=>{save(false);if(!synced&&!resetting&&Date.now()>=pullTry){pullTry=Date.now()+15000;pullPi()}};
  setInterval(tick,1500);tick();
  addEventListener("pagehide",()=>save(false));
  document.addEventListener("visibilitychange",()=>{if(document.hidden)save(false)});

  // Settings sheet: Export / Import / Reset
  const card=document.createElement("div");card.className="card";
  card.innerHTML='<div class="ql">Layout and settings</div><div class="chips"><button class="chip" data-rh="export">Export</button><button class="chip" data-rh="import">Import</button><button class="chip" data-rh="reset">Reset</button></div><input type="file" id="rh-file" accept="application/json,.json" hidden>';
  $("#sq .sg").appendChild(card);
  let armed=0;
  ST.addEventListener("click",e=>{
    const b=e.target.closest("[data-rh]");if(!b)return;
    const k=b.dataset.rh;
    if(k==="export"){
      const url=URL.createObjectURL(new Blob([JSON.stringify(snap(),null,2)],{type:"application/json"}));
      const a=document.createElement("a");a.href=url;a.download="roomhub-settings.json";document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Exported");
    }else if(k==="import"){$("#rh-file").click()}
    else if(k==="reset"){
      if(!armed){b.textContent="Tap again to reset";armed=setTimeout(()=>{armed=0;b.textContent="Reset"},3000);return}
      clearTimeout(armed);resetting=true;
      (async()=>{
        try{const r=await fetch("/api/settings",{method:"DELETE",signal:tmo(4000)});if(!r.ok)throw 0}
        catch(x){if(synced){resetting=false;armed=0;b.textContent="Reset";return toast("Can't reach the Pi, so nothing was reset. Try again.")}}
        try{localStorage.removeItem(KEY);localStorage.removeItem(AT)}catch(x){}
        location.reload();
      })();
    }
  });
  $("#rh-file").addEventListener("change",e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{let ok=false;try{ok=apply(JSON.parse(r.result))}catch(x){}if(ok){save(true);toast("Imported")}else toast("That file isn't a Room hub export")};
    r.readAsText(f);e.target.value="";
  });
})();
</script>
<script>
/* ===== Light bridge: keeps the Light widget in sync with the real bulb (Pi bridge, /api/light) =====
   - local taps are pushed to the bulb (debounced); the bulb is polled every 3 s and the UI follows it
   - if the bridge can't be reached (page opened from a laptop), the dashboard just works locally */
(function(){
  const LS={sig:null,c:S.c,pulling:false,local:0,off:false,timer:0,busy:false,dirty:false,touch:false,drag:false};
  const sigOf=()=>S.on+"|"+S.c+"|"+S.b;
  LS.sig=sigOf();
  const hd=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d};
  const nearest=h=>{let bi=0,bd=999;C.forEach((c,i)=>{const d=hd(h,c[1]);if(d<bd){bd=d;bi=i}});return bi};
  const tmo=ms=>{if(typeof AbortController==="undefined")return undefined;const a=new AbortController();setTimeout(()=>a.abort(),ms);return a.signal};

  const _paint=paint;
  paint=function(){
    if(!LS.pulling){
      const s=sigOf();
      if(s!==LS.sig||LS.touch){
        if(S.c!==LS.c||LS.touch){S.hu=S.sa=S.hs=S.ct=undefined;S.bm=S.c===0?"white":"colour"}
        LS.sig=s;LS.c=S.c;LS.local=Date.now();schedule();
      }
    }
    LS.touch=false;
    _paint();
    if(S.on&&S.hu!==undefined&&hd(S.hu,C[S.c][1])>20)$$(".js-cn").forEach(e=>e.textContent="Custom colour");
    if(LS.off){$$(".js-bv").forEach(e=>e.textContent="Bulb offline");$$(".js-orb").forEach(e=>e.classList.add("off"))}
    syncLt();
  };

  function body(){
    if(!S.on)return{on:false};
    const c=C[S.c],bm=S.bm||(S.c===0?"white":"colour");
    if(bm==="white")return{on:true,mode:"white",colorTemp:S.ct??0,brightness:S.b};
    return{on:true,mode:"colour",color:{h:S.hu??c[1],s:S.hs??c[2],v:S.b}};
  }
  function schedule(){clearTimeout(LS.timer);LS.timer=setTimeout(()=>{LS.timer=0;push()},250)}
  /* Light panel: colour wheel, white temperature, tap-to-open */
  window.setLight=function(p){
    Object.assign(S,p);S.on=true;S.sc=-1;LS.sig=sigOf();LS.c=S.c;LS.local=Date.now();
    if(!LS.timer)LS.timer=setTimeout(()=>{LS.timer=0;push()},150);   /* throttled: updates the bulb while dragging */
    LS.pulling=true;paint();LS.pulling=false;
  };
  function syncLt(){
    const m=$("#wm"),w=S.bm==="white"||(S.bm===undefined&&S.c===0);
    m.style.display=S.on&&!w?"block":"none";
    const h=(S.hu??C[S.c][1])*Math.PI/180,s=(S.hs??C[S.c][2])/100;
    m.style.left=50+s*50*Math.cos(h)+"%";m.style.top=50-s*50*Math.sin(h)+"%";
    if(!LS.drag)$("#ctr").value=S.ct??50;
  }
  let drawn=false;
  function drawWheel(){
    const c=$("#wh"),x=c.getContext("2d"),n=360,R=n/2,d=x.createImageData(n,n);
    for(let py=0;py<n;py++)for(let px=0;px<n;px++){
      const dx=px+.5-R,dy=R-py-.5,s=Math.hypot(dx,dy)/R;if(s>1)continue;
      let h=Math.atan2(dy,dx)*180/Math.PI;if(h<0)h+=360;
      const f=k=>{const t=(k+h/60)%6;return 255*(1-s*Math.max(0,Math.min(t,4-t,1)))},i=(py*n+px)*4;
      d.data[i]=f(5);d.data[i+1]=f(3);d.data[i+2]=f(1);d.data[i+3]=255}
    x.putImageData(d,0,0);
  }
  const wh=$("#wh");let wd=false;
  const pick=e=>{
    const r=wh.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=r.height/2-(e.clientY-r.top);
    let h=Math.atan2(y,x)*180/Math.PI;if(h<0)h+=360;
    const s=Math.max(10,Math.min(100,Math.hypot(x,y)/(r.width/2)*100));
    setLight({bm:"colour",hu:Math.round(h),hs:Math.round(s),sa:Math.min(85,Math.max(45,Math.round(s))),ct:undefined,c:nearest(h)});
  };
  wh.addEventListener("pointerdown",e=>{wd=true;wh.setPointerCapture(e.pointerId);pick(e)});
  wh.addEventListener("pointermove",e=>{if(wd)pick(e)});
  const wend=()=>{wd=false};wh.addEventListener("pointerup",wend);wh.addEventListener("pointercancel",wend);
  $("#ctr").addEventListener("input",e=>setLight({bm:"white",c:0,ct:+e.target.value,hu:undefined,hs:undefined,sa:undefined}));
  fill($("#lt"));
  ST.addEventListener("click",e=>{
    const t=e.target;
    if(t.closest('[data-a="lx"]'))return $("#lt").classList.remove("on");
    if(t.closest('.t[aria-label="Bedside light"]')&&!L&&!t.closest("button,input,.ov,[data-a]")){
      if(!drawn){drawn=true;drawWheel()}
      $("#lt").classList.add("on");syncLt();
    }
  });
  function setOff(v){if(LS.off!==v){LS.off=v;paint()}}

  async function push(){
    if(LS.busy){LS.dirty=true;return}
    LS.busy=true;
    try{
      const r=await fetch("/api/light",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body()),signal:tmo(8000)});
      let d={};try{d=await r.json()}catch(e){}
      setOff(r.status===502||d.online===false);
    }catch(e){/* bridge unreachable: stay local */}
    LS.busy=false;
    if(LS.dirty){LS.dirty=false;schedule()}
  }

  async function pull(){
    if(document.hidden||LS.busy||LS.timer||LS.drag||Date.now()-LS.local<3000)return;
    try{
      const r=await fetch("/api/light",{cache:"no-store",signal:tmo(4000)});
      const d=await r.json();
      if(LS.busy||LS.timer||LS.drag||Date.now()-LS.local<3000)return;
      if(d.online===false){setOff(true);return}
      LS.pulling=true;LS.off=false;
      const white=d.mode==="white"||d.color.s<12;
      S.on=!!d.on;S.b=Math.max(5,Math.round(d.brightness)||5);S.bm=white?"white":"colour";
      if(white){S.c=0;S.hu=S.sa=S.hs=undefined;S.ct=d.colorTemp}
      else{S.c=nearest(d.color.h);S.hu=d.color.h;S.hs=d.color.s;S.sa=Math.min(85,Math.max(45,d.color.s));S.ct=undefined}
      S.sc=SC.findIndex(x=>x[1]===S.c&&x[2]===S.b);
      LS.sig=sigOf();LS.c=S.c;
      paint();
      LS.pulling=false;
    }catch(e){LS.pulling=false}
  }

  document.addEventListener("pointerdown",e=>{if(e.target.closest&&e.target.closest(".js-br"))LS.drag=true},true);
  const up=()=>{LS.drag=false};
  document.addEventListener("pointerup",up,true);document.addEventListener("pointercancel",up,true);
  ST.addEventListener("click",e=>{if(e.target.closest('[data-a="sw"],[data-a="sc"],[data-a="tg"],[data-a="off"]'))LS.touch=true},true);
  document.addEventListener("visibilitychange",pull);
  setInterval(pull,3000);pull();
})();
</script>
<script>
/* ===== Weather: shown from the Pi bridge (/api/weather), which fetches Open-Meteo and caches it =====
   Refreshes every 10 min and when the tablet wakes. If the bridge can't be reached, the last values stay on screen. */
(function(){
  const IC={clear:["sun","moon"],partly:["cloud","cloud"],cloud:["cloud","cloud"],fog:["cloud","cloud"],rain:["rain","rain"],snow:["snow","snow"],storm:["bolt","bolt"]};

    $$(".js-ws").forEach(e=>e.textContent=d?d.temp+"° and "+d.desc.toLowerCase():"");
    if(d){const ic=(IC[d.icon]||IC.cloud)[d.isDay===false?1:0];$$(".js-wi use").forEach(u=>u.setAttribute("href","#i-"+ic))}
  }
  async function pull(){

      const ctl=typeof AbortController!=="undefined"?new AbortController():null;
      if(ctl)setTimeout(()=>ctl.abort(),6000);
      const r=await fetch("/api/weather",{cache:"no-store",signal:ctl?ctl.signal:undefined});

})();

<script>
/* ===== Media: Spotify, controlled through the Pi bridge (/api/media) =====
   The music plays in the Spotify app on this tablet (out over Bluetooth); the Pi just remote-controls it.
   Play/pause and volume changes are sent after a short pause (debounced); state is polled every 3 s.
   If the bridge can't be reached (page opened from a laptop), the widget stays a local demo. */
(function(){
  const MS={play:S.play,vol:S.vol,pend:{},timer:0,busy:false,local:0,pulling:false,drag:false};
  const tmo=ms=>{if(typeof AbortController==="undefined")return undefined;const a=new AbortController();setTimeout(()=>a.abort(),ms);return a.signal};
  const live=()=>MD&&MD.connected;
  const _paint=paint;
  paint=function(){
    if(!MS.pulling&&live()){
      if(S.play!==MS.play){MS.pend.play=S.play?"play":"pause";queue()}
      if(S.vol!==MS.vol){MS.pend.vol=S.vol;queue()}
    }
    MS.play=S.play;MS.vol=S.vol;
    _paint();show();
  };
  function show(){
    const d=MD;if(!d)return;
    let t="Nothing playing",a="Open Spotify on the tablet, then press play";
    if(d.setup){t="Spotify not connected";a="Finish the Spotify setup on the Pi"}
    else if(d.error){t="Spotify problem";a=d.error}
    else if(d.active){t=d.title;a=d.artist||d.device||""}
    $$(".js-mt").forEach(e=>e.textContent=t);$$(".js-ma").forEach(e=>e.textContent=a);
    const url=d.active&&d.art?d.art:"";
    $$(".art").forEach(e=>{
      if(e.dataset.u===url)return;e.dataset.u=url;
      if(url){const im=new Image();im.alt="";im.referrerPolicy="no-referrer";im.onerror=()=>{e.dataset.u="";e.innerHTML=I("note")};im.src=url;e.replaceChildren(im)}
      else e.innerHTML=I("note");
    });
    bar();
  }
  /* Progress bar: the browser glides it to the end of the track at constant speed (transform only).
     It is re-synced only when the track or play state changes, or it has drifted by more than 2 s. */
  const BR={key:"",t0:0,p0:0,play:false};
  function bar(){
    const d=MD,els=$$(".trk div");
    if(!d||!d.active||!d.dur){
      if(BR.key!=="off"){BR.key="off";els.forEach(e=>{e.style.transition="none";e.style.transform="scaleX(0)"})}
      return;
    }
    const now=Date.now(),key=d.title+"|"+d.dur+"|"+S.play,pos=d.pos+(S.play?now-d.t:0);
    const exp=BR.t0?BR.p0+(BR.play?now-BR.t0:0):-1e9;
    if(key===BR.key&&Math.abs(exp-pos)<2000)return;
    BR.key=key;BR.t0=now;BR.p0=pos;BR.play=S.play;
    els.forEach(e=>{
      e.style.transition="none";e.style.transform="scaleX("+Math.max(0,Math.min(1,pos/d.dur))+")";void e.offsetWidth;
      if(S.play&&pos<d.dur){e.style.transition="transform "+(d.dur-pos)+"ms linear";e.style.transform="scaleX(1)"}
    });
  }
  function queue(){clearTimeout(MS.timer);MS.timer=setTimeout(flush,250);MS.local=Date.now()}
  async function post(body){
    try{
      const r=await fetch("/api/media",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:tmo(10000)});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){toast(d.error||"Spotify didn't respond");MS.local=0;setTimeout(pull,600)}
    }catch(e){toast("Can't reach the Pi")}
  }
  async function flush(){
    MS.timer=0;if(MS.busy){queue();return}
    MS.busy=true;const p=MS.pend;MS.pend={};
    if(p.play)await post({action:p.play});
    if(p.vol!==undefined)await post({action:"volume",value:p.vol});
    MS.busy=false;
  }
  async function pull(){
    if(document.hidden||MS.busy||MS.timer||MS.drag||Date.now()-MS.local<3000)return;
    try{
      const r=await fetch("/api/media",{cache:"no-store",signal:tmo(5000)});
      const d=await r.json();
      if(MS.busy||MS.timer||MS.drag||Date.now()-MS.local<3000)return;
      MD=Object.assign(d,{t:Date.now()});
      MS.pulling=true;
      if(d.active){S.play=!!d.playing;if(typeof d.volume==="number")S.vol=d.volume}
      else S.play=false;
      MS.play=S.play;MS.vol=S.vol;
      paint();MS.pulling=false;
    }catch(e){MS.pulling=false}
  }
  ST.addEventListener("click",e=>{
    const b=e.target.closest('[data-a="pv"],[data-a="nx"]');if(!b||!live())return;
    MS.local=Date.now();post({action:b.dataset.a==="nx"?"next":"previous"}).then(()=>{MS.local=0;setTimeout(pull,900)});
  });
  document.addEventListener("pointerdown",e=>{if(e.target.closest&&e.target.closest(".js-vl"))MS.drag=true},true);
  const up=()=>{MS.drag=false};
  document.addEventListener("pointerup",up,true);document.addEventListener("pointercancel",up,true);
  document.addEventListener("visibilitychange",pull);
  setInterval(pull,3000);pull();
})();
</script>
<script>
/* ===== Timers and alarm: owned by the Pi bridge (/api/timers) =====
   The Pi keeps the timers and the alarm running, and holds an alert "ringing" until Stop or Snooze is pressed.
   This page shows them, sounds the alert, and sends changes to the Pi. A reload, a sleeping screen or a second
   screen therefore can't lose or miss one: the alert appears as soon as the page is awake.
   If the Pi can't be reached for ~10 s the page falls back to running timers and the alarm on its own. */
(function(){
  const tmo=ms=>{if(typeof AbortController==="undefined")return undefined;const a=new AbortController();setTimeout(()=>a.abort(),ms);return a.signal};
  const aSig=()=>S.alarm.h+":"+S.alarm.m+":"+S.alarm.on;
  let sigA=null,alarmTimer=0,alarmPending=false,pulling=false,rk=0,fails=0,soon=0;

  function apply(d){
    const off=d.now-Date.now();                      /* Pi clock minus this tablet's clock */
    S.timers=d.timers.map(t=>({id:t.id,label:t.label,end:t.end-off,total:t.total}));
    if(d.alarm&&!alarmPending){S.alarm={h:d.alarm.h,m:d.alarm.m,on:d.alarm.on};sigA=aSig()}
    else if(!d.alarm)sigA=null;                       /* Pi has no alarm yet: send ours */
    const r=d.ringing;
    if(r&&r.since!==rk){rk=r.since;ring(r.title,r.sub)}
    else if(!r&&rk){rk=0;stopRing()}
    PI=true;fails=0;
    pulling=true;paint();pulling=false;
    if(sigA===null)paint();                           /* first contact: hand our alarm to the Pi now */
  }

  window.TPI=async function(body){
    try{
      const r=await fetch("/api/timers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:tmo(6000)});
      const d=await r.json();
      if(!r.ok){toast(d.error||"The Pi refused that");return}
      apply(d);
    }catch(e){toast("Can't reach the Pi")}
  };
  window.TSOON=function(){if(!soon)soon=setTimeout(()=>{soon=0;pull(true)},700)};   /* a timer just ran out: ask the Pi right away */

  async function pull(force){
    if(document.hidden&&!force)return;
    try{
      const r=await fetch("/api/timers",{cache:"no-store",signal:tmo(4000)});
      const d=await r.json();
      if(d&&d.ok)apply(d);
    }catch(e){if(PI&&++fails>=3){PI=false;toast("Lost the Pi: timers now run on this tablet")}}
  }

  const _paint=paint;
  paint=function(){
    if(!pulling&&PI&&aSig()!==sigA){
      sigA=aSig();alarmPending=true;clearTimeout(alarmTimer);
      alarmTimer=setTimeout(async()=>{await TPI({op:"alarm",h:S.alarm.h,m:S.alarm.m,on:S.alarm.on});alarmPending=false},300);
    }
    _paint();
  };
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
  setInterval(pull,3000);pull();
})();
</script>
<script>
/* ===== Calendar: events come from the Pi (/api/calendar). Tap "Today" or "Weather" for the full view. ===== */
(function(){
  let CAL=null;
  const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()),hm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
  const mk=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};   /* textContent only: event titles are never parsed as HTML */
  const row=(time,title)=>{const r=mk("div","ev"),b=mk("b","",time);r.append(b,document.createTextNode(title));return r};
  const dl=d=>{const n=Math.round((sod(d)-sod(new Date()))/864e5);return n===0?"Today":n===1?"Tomorrow":d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})};
  function evs(){
    if(!CAL)return[];
    return CAL.events.map(e=>{
      if(e.allDay){const a=e.start.split("-"),b=e.end.split("-");return{t0:new Date(+a[0],a[1]-1,+a[2]),t1:new Date(+b[0],b[1]-1,+b[2]),allDay:true,title:e.title}}
      return{t0:new Date(e.start),t1:new Date(e.end),allDay:false,title:e.title}});
  }
  function widgetRows(){
    if(!CAL||!CAL.configured)return[mk("div","none","No calendar connected yet")];
    if(CAL.error&&!CAL.events.length)return[mk("div","none","Calendar unavailable")];
    const now=new Date(),eod=new Date(sod(now).getTime()+864e5),all=evs();
    const today=all.filter(e=>e.t0<eod&&e.t1>now);
    if(today.length)return today.slice(0,6).map(e=>row(e.allDay?"All day":hm(e.t0),e.title));
    const nx=all.find(e=>e.t0>=eod),out=[mk("div","none","Nothing else today")];
    if(nx)out.push(row(dl(nx.t0),(nx.allDay?"":hm(nx.t0)+"  ")+nx.title));
    return out;
  }
  function show(){
    $$(".js-ev").forEach(c=>{
      const k=widgetRows(),key=k.map(x=>x.textContent).join("|");
      if(c.dataset.k!==key){c.dataset.k=key;c.replaceChildren(...k)}
    });
  }
  const _paint=paint;paint=function(){_paint();show()};
  async function pull(){
    if(document.hidden)return;
    try{const r=await fetch("/api/calendar",{cache:"no-store"});const d=await r.json();if(d&&d.ok){CAL=d;show()}}catch(e){}
  }
  function openXp(kind){
    const b=$("#xp-b");b.replaceChildren();
    if(kind==="Weather"){
      $("#xp-t").textContent=WX?WX.place:"Weather";
      if(!WX)b.append(mk("div","none","Weather unavailable"));
      else{
        b.append(mk("div","xbig",WX.temp+"°"),mk("div","xs",WX.desc+(WX.high!=null?", high "+WX.high+"°, low "+WX.low+"°":"")),mk("div","xh","Next days"));
        (WX.days||[]).forEach((d,i)=>b.append(row(i===0?"Today":new Date(d.date+"T12:00").toLocaleDateString(undefined,{weekday:"short"}),d.desc+"   "+d.high+"° / "+d.low+"°")));
      }
    }else{
      $("#xp-t").textContent="Coming up";
      const all=evs();let any=false;
      for(let i=0;i<7;i++){
        const a=new Date(sod(new Date()).getTime()+i*864e5),z=new Date(a.getTime()+864e5);
        const list=all.filter(e=>e.t0<z&&e.t1>a&&(i>0||e.t1>new Date()));
        if(!list.length)continue;any=true;
        b.append(mk("div","xh",dl(a)));list.forEach(e=>b.append(row(e.allDay?"All day":hm(e.t0),e.title)));
      }
      if(!any)b.append(mk("div","none",!CAL||!CAL.configured?"No calendar connected yet":"Nothing in the next 7 days"));
    }
    $("#xp").classList.add("on");
  }
  ST.addEventListener("click",e=>{
    const t=e.target;
    if(t.closest('[data-a="xx"]'))return $("#xp").classList.remove("on");
    const w=t.closest('.t[aria-label="Today"],.t[aria-label="Weather"]');
    if(w&&!L&&!t.closest("button,input,.ov,[data-a]"))openXp(w.getAttribute("aria-label"));
  });
  document.addEventListener("visibilitychange",pull);
  setInterval(pull,300000);pull();
})();
</script>
